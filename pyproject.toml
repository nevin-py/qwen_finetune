[project]
name = "qwen-finetune"
version = "0.1.0"
description = "Text-to-SQL fine-tuning, execution-based verification, and bounded repair"
requires-python = "==3.11.*"
# Heavy ML deps (torch, transformers, peft, trl, bitsandbytes, accelerate) are
# intentionally NOT installed here yet: they are installed only when their phase
# needs them, keeping the base env light. See reports/design.md §8.
dependencies = [
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]